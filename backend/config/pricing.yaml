# Prices used to calculate llm_calls.cost_usd from REAL token counts (IMPLEMENTATION_PLAN §7.1).
# Edit this file when prices or your plan change; re-check the providers' pricing pages before relying on it.
#
# billing:
#   free_tier -> cost recorded as 0.0 (you are on the provider's free plan)
#   local     -> cost recorded as 0.0 (runs on your own machine, e.g. Ollama)
#   paid      -> cost = input_tokens * input + output_tokens * output, prices in USD per 1M tokens
#                ASR (speech-to-text) models are listed under `audio_models` in USD per audio MINUTE.
# A model that is not listed under a paid provider gets cost_usd = null (unknown), never a guess.

checked: "2026-11-06"
currency: USD

providers:
  groq:
    billing: free_tier
    # Reference only (Groq Developer-plan list prices, console.groq.com/docs/models, checked 2026-11-06).
    # They are used only if you change billing to "paid" after upgrading your Groq plan.
    models:
      openai/gpt-oss-120b: { input: 0.15, output: 0.60 }
      openai/gpt-oss-20b: { input: 0.075, output: 0.30 }
      # qwen/qwen3.8-27b (eval judge, Phase 11): NOT listed: its list price has not been verified, so its
      # equivalent cost is reported as unpriced. Add it here only after checking console.groq.com/docs/models.
      # (llama-3.3-70b-versatile, the first judge choice, is no longer offered to this key: 404 on 2026-11-09.)
    audio_models:
      whisper-large-v3-turbo: 0.000667   # reference only: $0.04 per audio hour (Developer plan)

  openai:
    billing: paid
    # Optional, opt-in provider. Price from IMPLEMENTATION_PLAN §3 (checked Nov 2026) — verify at openai.com/api/pricing.
    models:
      gpt-5-mini: { input: 0.25, output: 2.00 }
    audio_models:
      whisper-1: 0.006                   # USD per audio minute — verify at openai.com/api/pricing

  local:
    billing: local                       # ASR_PROVIDER=local (faster-whisper) and the embedding model, on your machine

  ollama:
    billing: local
